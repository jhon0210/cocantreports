AWSTemplateFormatVersion: '2010-09-09'
Description: Cocjant staging - ECR inicial sin Terraform ni bucket de estado
Parameters:
  CreateGithubOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Solo true si no existe proveedor GitHub en esta cuenta y se aprueba crearlo.
Conditions:
  CreateOidc: !Equals [!Ref CreateGithubOidcProvider, 'true']
Rules:
  Region:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Desplegar solo en us-east-1.
Resources:
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: cocjant-staging-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cocjant-staging-*
      Tags:
        - {Key: Project, Value: cocjant}
        - {Key: Environment, Value: staging}
Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  GithubOidcProviderArn:
    Condition: CreateOidc
    Value: !Ref GithubOidc
